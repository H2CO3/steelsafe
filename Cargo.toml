[package]
name = "steelsafe"
version = "0.3.1"
edition = "2021"
authors = ["H2CO3 <arpad.goretity@gmail.com>"]
license = "MIT"
description = "Simple, personal TUI password manager"
documentation = "https://docs.rs/steelsafe"
categories = ["authentication", "command-line-utilities", "cryptography"]
keywords = ["password", "password-manager", "security", "cryptography", "crypto"]
repository = "https://github.com/H2CO3/steelsafe/"
homepage = "https://h2co3.github.io/steelsafe/"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
chrono = { version = "0.4.38", features = ["serde"] }
directories = "6.0"
rand = "0.10"
zeroize = "1.9.1"
block-padding = "0.4.2"
crypto-common = "0.2.2"
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
nanosql = { version = "0.12.0", features = ["chrono"] }
ratatui = { version = "0.29", features = ["serde"] }
tui-textarea = "0.7"
arboard = "3.7.0"

[dev-dependencies]
zxcvbn = "3.1.1"
